<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportFit - Tienda Deportiva Juvenil</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            color: #333;
        }
        header {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 25px 10px;
        }
        header h1 {
            color: #00e676;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }
        header p {
            color: #ccc;
            margin-top: 5px;
        }
        
        /* Seccion de Filtros */
        .contenedor-filtros {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex-wrap: wrap;
        }
        .grupo-filtro {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }
        select {
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
            outline: none;
            cursor: pointer;
        }

        /* Catalogo de Productos */
        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            padding: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .tarjeta {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        .tarjeta:hover {
            transform: translateY(-5px);
        }
        .tarjeta img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .contenido-tarjeta {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .tarjeta h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .categoria-tag {
            font-size: 0.8rem;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .precio {
            color: #00c853;
            font-weight: bold;
            font-size: 1.2rem;
            margin: 8px 0;
        }
        .btn-agregar {
            background: #111;
            color: white;
            border: none;
            padding: 10px 15px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s ease;
        }
        .btn-agregar:hover {
            background: #00e676;
            color: #111;
        }

        /* Carrito Flotante */
        .carrito-flotante {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #111;
            color: white;
            border: 2px solid #00e676;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }
        .carrito-flotante:hover {
            transform: scale(1.08);
        }
        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff3d00;
            color: white;
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 50%;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>SportFit</h1>
        <p>Ropa Deportiva Juvenil</p>
    </header>

    <!-- Filtros de búsqueda -->
    <div class="contenedor-filtros">
        <div class="grupo-filtro">
            <label for="filtroGenero">Género:</label>
            <select id="filtroGenero" onchange="filtrar()">
                <option value="todos">Todos</option>
                <option value="hombre">Hombre</option>
                <option value="mujer">Mujer</option>
            </select>
        </div>

        <div class="grupo-filtro">
            <label for="filtroTipo">Prenda:</label>
            <select id="filtroTipo" onchange="filtrar()">
                <option value="todos">Todos</option>
                <option value="polos">Polos</option>
                <option value="shorts">Shorts</option>
                <option value="zapatillas">Zapatillas</option>
            </select>
        </div>
    </div>

    <!-- Catálogo de productos -->
    <div class="catalogo" id="contenedor"></div>

    <!-- Icono flotante del Carrito -->
    <div class="carrito-flotante" onclick="verCarrito()">
        🛒 <span class="badge" id="contador">0</span>
    </div>

    <script>
        const productos = [
            { 
                id: 1, 
                nombre: "Polo Running Pro", 
                genero: "hombre", 
                tipo: "polos", 
                precio: 59.90, 
                imagen: "hombre.jfif" 
            },
            { 
                id: 2, 
                nombre: "Short Training Fit", 
                genero: "hombre", 
                tipo: "shorts", 
                precio: 45.00, 
                imagen: "hombre2.jfif" 
            },
            { 
                id: 3, 
                nombre: "Zapatillas Speed Run", 
                genero: "hombre", 
                tipo: "zapatillas", 
                precio: 189.00, 
                imagen: "hombre3.jpg" 
            },
            { 
                id: 4, 
                nombre: "Polo Dry-Fit Light", 
                genero: "mujer", 
                tipo: "polos", 
                precio: 49.90, 
                imagen: "mujer 4.jfif" 
            },
            { 
                id: 5, 
                nombre: "Short Flex Sport", 
                genero: "mujer", 
                tipo: "shorts", 
                precio: 39.90, 
                imagen: "mujer 6.jfif" 
            },
            { 
                id: 6, 
                nombre: "Zapatillas Air Zoom", 
                genero: "mujer", 
                tipo: "zapatillas", 
                precio: 199.00, 
                imagen: "mujer3.jfif" 
            }
        ];

        let miCarrito = [];

        function renderizarProductos(lista) {
            const contenedor = document.getElementById("contenedor");
            contenedor.innerHTML = "";

            if (lista.length === 0) {
                contenedor.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>No hay productos disponibles para este filtro.</p>";
                return;
            }

            lista.forEach(p => {
                contenedor.innerHTML += `
                    <div class="tarjeta">
                        <img src="${p.imagen}" alt="${p.nombre}">
                        <div class="contenido-tarjeta">
                            <div>
                                <h3>${p.nombre}</h3>
                                <div class="categoria-tag">${p.genero} | ${p.tipo}</div>
                            </div>
                            <div>
                                <div class="precio">S/ ${p.precio.toFixed(2)}</div>
                                <button class="btn-agregar" onclick="agregarAlCarrito(${p.id})">Agregar al Carrito</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filtrar() {
            let generoSeleccionado = document.getElementById("filtroGenero").value;
            let tipoSeleccionado = document.getElementById("filtroTipo").value;

            let resultado = productos.filter(p => {
                let coincideGenero = (generoSeleccionado === "todos" || p.genero === generoSeleccionado);
                let coincideTipo = (tipoSeleccionado === "todos" || p.tipo === tipoSeleccionado);
                return coincideGenero && coincideTipo;
            });

            renderizarProductos(resultado);
        }

        function agregarAlCarrito(id) {
            let item = productos.find(p => p.id === id);
            miCarrito.push(item);
            document.getElementById("contador").innerText = miCarrito.length;
            alert(`¡${item.nombre} agregado al carrito!`);
        }

        function verCarrito() {
            if (miCarrito.length === 0) {
                alert("Tu carrito está vacío.");
                return;
            }
            let total = miCarrito.reduce((suma, item) => suma + item.precio, 0);
            let detalle = miCarrito.map(item => `- ${item.nombre}: S/ ${item.precio.toFixed(2)}`).join("\n");
            alert(`--- CARRITO DE COMPRAS ---\n\n${detalle}\n\nTOTAL A PAGAR: S/ ${total.toFixed(2)}`);
        }

        // Cargar todos los productos al iniciar
        renderizarProductos(productos);
    </script>
</body>
</html>
